<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修仙模拟器 2.0</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/character.css">
</head>
<body>

<div id="app">
    <header class="app-header">
        <h1>🌿 修仙模拟器 <span class="ver">2.0</span></h1>
        <div class="header-actions">
            <button id="btn-home" class="hidden">🏠 主页</button>
            <button id="btn-save" class="hidden">💾 存档</button>
            <button id="btn-load">📂 读档</button>
            <button id="btn-new" class="hidden">🔄 新局</button>
        </div>
    </header>

    <!-- 1. 主页：角色修炼动画 -->
    <section id="screen-home" class="screen">
        <div id="home-container"></div>
        <div class="home-actions">
            <button id="btn-select-char" class="primary">选择角色 · 开始修行</button>
            <button id="btn-continue-home" class="ghost hidden">继续上次修行</button>
        </div>
    </section>

    <!-- 2. 角色选择 -->
    <section id="screen-select" class="screen hidden">
        <div id="select-container"></div>
    </section>

    <!-- 3. 主界面 -->
    <section id="screen-main" class="screen hidden">
        <div class="main-layout">
            <div id="hud-container" class="hud-container"></div>
            <div id="panel-container" class="panel-container"></div>
        </div>
    </section>
</div>

<div id="modal" class="modal hidden">
    <div class="modal-content">
        <span id="modal-close" class="modal-close">×</span>
        <div id="modal-body"></div>
    </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
